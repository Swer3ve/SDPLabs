image: python:3.12-slim

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - test

python_tests:
  stage: test

  before_script:
    - python --version
    - python -m pip install -r lab7/requirements.txt

  script:
    - cd lab7
    - python -m pytest -v