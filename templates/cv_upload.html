<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CV байршуулах</title>
</head>
<body>
    <h1>CV файл байршуулах</h1>

    {% if message %}<p style="color:green">{{ message }}</p>{% endif %}
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}

    <form method="post" enctype="multipart/form-data">
        <input type="file" name="cv" accept=".pdf,.docx">
        <button type="submit">Байршуулах</button>
    </form>
</body>
</html>
